<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>デジタル出席簿</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="header-title">
      <h1>出席簿</h1>
      <div id="classInfo"></div>
    </div>

    <div class="header-controls">

      <button id="prevMonth" class="nav-button">
        前月
      </button>

      <div id="monthLabel" class="month-label"></div>

      <button id="nextMonth" class="nav-button">
        次月
      </button>

      <button id="editButton" class="edit-button">
        編集
      </button>

    </div>

  </header>


  <main>

    <section class="book">

      <table id="attendanceTable">

        <thead>

          <tr id="dateRow">

            <th class="number-column">
              No.
            </th>

            <th class="name-column">
              生徒氏名
            </th>

          </tr>

        </thead>

        <tbody id="studentRows"></tbody>

      </table>

    </section>

  </main>


  <!-- 出席入力モーダル -->

  <div id="attendanceModal" class="modal hidden">

    <div class="modal-content attendance-modal">

      <div class="modal-header">

        <div>
          <div class="modal-subtitle">
            出席入力
          </div>

          <h2 id="attendanceDateTitle"></h2>
        </div>

        <button id="closeAttendanceModal" class="modal-close">
          ×
        </button>

      </div>


      <div class="bulk-controls">

        <button
          id="allPresentButton"
          class="bulk-button"
        >
          全員出席
        </button>

        <button
          id="allAbsentButton"
          class="bulk-button"
        >
          全員欠席
        </button>

        <button
          id="clearAllButton"
          class="bulk-button secondary"
        >
          すべて解除
        </button>

      </div>


      <div class="attendance-list">

        <div class="attendance-list-header">

          <div class="student-header">
            生徒氏名
          </div>

          <div>出席</div>
          <div>欠席</div>
          <div>遅刻</div>
          <div>振替</div>

        </div>

        <div id="attendanceStudentList"></div>

      </div>


      <div class="modal-footer">

        <div id="inputCount" class="input-count">
          0人入力済み
        </div>

        <div class="modal-footer-buttons">

          <button
            id="cancelAttendance"
            class="cancel-button"
          >
            キャンセル
          </button>

          <button
            id="saveAttendance"
            class="save-button"
          >
            保存して閉じる
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- 編集モーダル -->

  <div id="editModal" class="modal hidden">

    <div class="modal-content edit-modal">

      <div class="modal-header">

        <div>
          <div class="modal-subtitle">
            出席簿設定
          </div>

          <h2>基本情報を編集</h2>
        </div>

        <button id="closeEditModal" class="modal-close">
          ×
        </button>

      </div>


      <div class="settings-section">

        <label>
          学年

          <input
            id="gradeInput"
            type="text"
            placeholder="例：中学3年"
          >

        </label>


        <label>
          クラス

          <input
            id="classInput"
            type="text"
            placeholder="例：1組"
          >

        </label>

      </div>


      <div class="students-section">

        <div class="section-title">
          生徒氏名
        </div>

        <div id="studentEditor"></div>

        <button
          id="addStudent"
          class="add-student-button"
        >
          ＋ 生徒を追加
        </button>

      </div>


      <div class="modal-footer">

        <div></div>

        <div class="modal-footer-buttons">

          <button
            id="cancelEdit"
            class="cancel-button"
          >
            キャンセル
          </button>

          <button
            id="saveSettings"
            class="save-button"
          >
            保存
          </button>

        </div>

      </div>

    </div>

  </div>


  <script src="app.js"></script>

</body>
</html>
